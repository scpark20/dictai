    <section class="import-card" aria-labelledby="importTitle">
      <h1 id="importTitle" class="sr-only">YouTube listening practice</h1>
      <form id="importForm" class="import-form">
        <label class="url-field"><span>YouTube link</span><input id="videoUrl" type="text" inputmode="url" placeholder="Paste a YouTube link…" maxlength="2000" required autocomplete="off"></label>
        <label><span>Captions</span><select id="captionLanguage"><option value="en">English</option><option value="ko">한국어</option></select></label>
        <button id="loadButton" class="primary" type="submit">Load video →</button>
      </form>
      <p id="importStatus" class="status" role="status" aria-live="polite">Use a video with captions. Original video audio — no generated voices.</p>
      <details id="manualDetails">
        <summary>Have a caption file? Use SRT / VTT</summary>
        <div class="manual-import">
          <label>Caption file<input type="file" id="subtitleFile" accept=".srt,.vtt,text/vtt,application/x-subrip"></label>
          <label>Or paste timed captions<textarea id="subtitleText" rows="4" placeholder="00:00:01.000 --> 00:00:04.000&#10;The original caption goes here." maxlength="2000000"></textarea></label>
          <button id="useSubtitles" type="button">Use these captions</button>
        </div>
      </details>
    </section>

    <div class="empty-stage" id="emptyStage"><span>▶</span><p>Paste a YouTube link above to load your video.</p></div>

    <div class="workspace" id="workspace" hidden>
      <section class="media-column" aria-label="Video and timeline">
        <div class="video-card">
          <div class="video-frame"><div id="youtubePlayer"></div></div>
          <div class="video-info"><h2 id="videoTitle"></h2><a id="originalLink" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a></div>
          <p class="status player-status" id="playerStatus" role="status">Loading the YouTube player…</p>
        </div>
      </section>

    </div>
