<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>EchoStep</title>
    <link rel="stylesheet" href="./styles.css?v=dev-24" />
  </head>
  <body data-level="A1">
    <div class="app-layout">
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="EchoStep home">EchoStep</a>
        <span class="profile" aria-hidden="true">S</span>
      </header>

      <section class="hero" aria-labelledby="pageTitle">
        <p class="eyebrow">English practice</p>
        <h1 id="pageTitle">What do you want to learn?</h1>
      </section>

      <section class="picker" aria-label="Choose your level">
        <h2>Level</h2>
        <div class="levels" role="radiogroup" aria-label="English level">
          <button class="level is-active" type="button" data-level="A1" role="radio" aria-checked="true">A1</button>
          <button class="level" type="button" data-level="A2" role="radio" aria-checked="false">A2</button>
          <button class="level" type="button" data-level="B1" role="radio" aria-checked="false">B1</button>
          <button class="level" type="button" data-level="B2" role="radio" aria-checked="false">B2</button>
          <button class="level" type="button" data-level="C1" role="radio" aria-checked="false">C1</button>
          <button class="level" type="button" data-level="C2" role="radio" aria-checked="false">C2</button>
        </div>
      </section>

      <section class="paths" aria-label="Choose practice type">
        <div class="path-group">
          <div class="path">
            <span class="path-icon" aria-hidden="true">••</span>
            <span><strong>Conversation</strong><small>Everyday listening</small></span>
          </div>
          <div class="mini-list" id="topicList"></div>
        </div>
        <div class="path-group">
          <div class="path">
            <span class="path-icon book-icon" aria-hidden="true">▤</span>
            <span><strong>Book</strong><small>Stories and novels</small></span>
          </div>
          <div class="mini-list" id="bookList"></div>
        </div>
      </section>
    </main>
    <section class="practice-panel" id="practicePanel" aria-label="EchoStep practice">
      <iframe id="practiceFrame" title="EchoStep practice" src="./practice/"></iframe>
    </section>
    </div>
    <script src="./app.js?v=dev-24"></script>
  </body>
</html>
